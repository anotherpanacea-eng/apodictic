name: ci

# Ordinary work remains draft and unarmed. A disposable train, or an explicitly
# authorized standalone exception, receives this one ordered validation job.

run-name: >-
  apodictic-ci pr=${{ github.event.pull_request.number }}
  action=${{ github.event.action }}
  train=${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'train/') }}
  ci-ready-event=${{ github.event.label.name == 'ci-ready' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, closed]

permissions:
  contents: read

concurrency:
  group: >-
    apodictic-ci-${{ github.event.pull_request.number }}-${{ ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || (github.event.label.name == 'ci-ready' && !(github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'train/')))) && 'clearance' || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      ${{ github.event.pull_request.draft == false &&
          ((github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'train/') &&
            contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)) ||
           (!(github.event.pull_request.head.repo.full_name == github.repository &&
              startsWith(github.event.pull_request.head.ref, 'train/')) &&
            !(github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.head.ref == 'chore/sync-setec-contract') &&
            contains(github.event.pull_request.labels.*.name, 'ci-ready') &&
            (contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) ||
             (github.event.action == 'labeled' && github.event.label.name == 'ci-ready')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bind billed job to the exact pull-request merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          JOB_NAME: ${{ github.job }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python tools/check_pr_merge_binding.py
          --repository "$REPOSITORY"
          --base "$BASE_SHA" --head "$HEAD_SHA" --github-sha "$MERGE_SHA"
          --job "$JOB_NAME" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install policy test dependencies
        run: python -m pip install pytest pyyaml

      - name: Draft-first train policy self-tests
        run: >-
          python -m pytest
          tests/test_ci_train_policy.py
          tests/test_merge_train.py
          tests/test_pr_merge_binding.py
          tests/test_sync_pr_draft.py
          tests/test_train_ci_receipts.py
          -q

      - name: Byte-compile canonical Python (syntax gate)
        run: python -m compileall -q plugins scripts tools tests

      - name: Validate plugin + marketplace manifests parse as JSON
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.json' | grep -E '(plugin|marketplace|release-registry)\.json$')
          if [ ${#files[@]} -eq 0 ]; then echo "no manifests found"; exit 1; fi
          for f in "${files[@]}"; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done
          echo "all ${#files[@]} manifests parse"

      - name: Version parity across manifests
        run: node scripts/release-verify.mjs --versions-only

      - name: Research reliability self-tests
        run: |
          python3 plugins/apodictic/skills/specialized-audits/scripts/api_reliability.py --self-test
          python3 plugins/apodictic/skills/specialized-audits/scripts/response_cache.py --self-test
          python3 plugins/apodictic/skills/specialized-audits/scripts/academic_apis.py --self-test

      - name: Changelog fragments parse
        run: node scripts/assemble-changelog.mjs --check

      - name: Status-drift lint (spec Status vs shipped deliverables)
        run: |
          node scripts/check-status-drift.mjs --self-test
          node scripts/check-status-drift.mjs

      - name: Inventory-parity sync-marker check
        run: |
          node scripts/check-inventory-parity.mjs --self-test
          node scripts/check-inventory-parity.mjs

      - name: Registry-derived docs are up to date
        run: node scripts/release-generate.mjs --check

      - name: Codex + Antigravity builds self-check
        run: |
          node scripts/build-codex.mjs --self-check
          node scripts/build-antigravity.mjs --self-check

      - name: SETEC contract drift gate (self-consistency)
        run: python tools/check_setec_contract.py

      - name: SETEC contract tests (floors + vendored-golden parse)
        run: python tests/setec-contract/test_setec_contract.py

      - name: Validator self-tests
        run: bash scripts/validate.sh --self-test-all

      - name: Canonical-framework gate
        run: bash scripts/validate.sh --check-canonical
