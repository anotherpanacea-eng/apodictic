name: ci

# Public repository, so Actions minutes are free. Drafts start nothing; a
# non-draft PR (usually a train/ branch) runs the Ubuntu validation job and the
# Windows native-gate job.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: apodictic-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Claude workflow safety and native aggregate tests
        run: >-
          python -m pytest
          tests/test_ci_train_policy.py
          tests/test_validate_native_aggregates.py
          -q

      - name: Byte-compile canonical Python (syntax gate)
        run: python -m compileall -q plugins scripts tools tests

      - name: Validate plugin + marketplace manifests parse as JSON
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.json' | grep -E '(plugin|marketplace|release-registry)\.json$')
          if [ ${#files[@]} -eq 0 ]; then echo "no manifests found"; exit 1; fi
          for f in "${files[@]}"; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done
          echo "all ${#files[@]} manifests parse"

      - name: Version parity across manifests
        run: node scripts/release-verify.mjs --versions-only

      - name: Research reliability self-tests
        run: |
          node --test tests/audit-catalog.test.mjs
          python3 -m unittest discover -s tests -p 'test_academic_*.py'
          python3 plugins/apodictic/skills/research-verification/scripts/api_reliability.py --self-test
          python3 plugins/apodictic/skills/research-verification/scripts/response_cache.py --self-test
          python3 plugins/apodictic/skills/research-verification/scripts/academic_apis.py --self-test

      - name: Changelog fragments parse
        run: node scripts/assemble-changelog.mjs --check

      - name: Validator inventory check
        run: python -I -S plugins/apodictic/scripts/validator_runner.py --check-inventory

      - name: Registry-derived docs are up to date
        run: node scripts/release-generate.mjs --check

      - name: Codex + Antigravity builds self-check
        run: |
          node scripts/build-codex.mjs --self-check
          node scripts/build-antigravity.mjs --self-check

      - name: SETEC contract drift gate (self-consistency)
        run: python tools/check_setec_contract.py

      - name: SETEC contract tests (floors + vendored-golden parse)
        run: python tests/setec-contract/test_setec_contract.py

      - name: Validator self-tests
        run: bash scripts/validate.sh --self-test-all

      - name: Canonical-framework gate
        run: bash scripts/validate.sh --check-canonical

  validate-windows:
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Native validator gate with only Python on PATH
        env:
          PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          $env:PATH = Split-Path -Parent $env:PYTHON_EXE
          & $env:PYTHON_EXE plugins/apodictic/scripts/validate.py --check-all
