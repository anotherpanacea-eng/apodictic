<title>APODICTIC: predicting the contract</title><style>
:root{--bg:#fbf8f1;--ink:#2b2a28;--muted:#6d685f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:clamp(17px,2.4vw,30px)/1.35 Georgia,'Iowan Old Style',serif}
main{height:100%;display:grid;grid-template-rows:auto 1fr auto auto;gap:.4em;padding:clamp(12px,2.5vw,36px)}
h1{margin:0;font-size:1.05em;font-weight:600}h1:empty{display:none}
.stage{min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage svg{width:100%;height:100%}
.cap{min-height:2.7em;margin:0;text-align:center}.nocap .cap{visibility:hidden}
nav{display:flex;gap:.5em;align-items:center;justify-content:center;font-size:.6em;color:var(--muted)}
nav button{font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:6px;padding:.35em .9em;min-height:44px;min-width:44px;cursor:pointer}
nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}.video nav{display:none}.video h1{display:none}

<script>
const STEPS=[{"caption":"APODICTIC reads your manuscript before it hears your plans.","len":1028},{"caption":"From the text alone it predicts the contract: genre, the promise to readers, and the controlling idea.","len":3146},{"caption":"Then it sets that prediction beside the contract you meant to write.","len":3745},{"caption":"Where they match, the book is measured against its own contract. A slow opening is fine in literary fiction and a defect in a thriller.","len":3373},{"caption":"Where they differ, that mismatch is the diagnosis: the text is not communicating what you think it is.","hold":2.5,"len":4072},{"caption":"Both feed the editorial letter, which names classes of solution and never rewrites your prose. Argument pieces get the same check against claim, audience, burden and stakes.","len":2847}];
const DRAW_PX_PER_MS=0.9,REST=1.2;
// Draw time per step scales with pencil length, clamped so tiny and huge steps both read well.
const drawMs=i=>Math.min(4000,Math.max(700,STEPS[i].len/DRAW_PX_PER_MS));
const groups=[...document.querySelectorAll('[data-step]')],cap=document.getElementById('cap'),count=document.getElementById('count'),nextBtn=document.getElementById('next');
for(const p of document.querySelectorAll('[data-len]')){const L=+p.dataset.len+4;p.style.strokeDasharray=L+' '+L;}
const offsets=groups.map(g=>{let at=0;return [...g.querySelectorAll('path')].map(p=>{const len=+(p.dataset.len||0),o=at;at+=len;return [p,o,len];});});
// Show step i at progress f (0..1): earlier steps whole, later hidden, strokes in drawing order.
function paint(i,f){groups.forEach((g,k)=>g.setAttribute('visibility',k<=i?'visible':'hidden'));
 groups.forEach((g,k)=>{if(k>i)return;const total=STEPS[k].len||1,head=(k<i?1:f)*total;
  for(const [p,o,len] of offsets[k]){if(!len){p.style.opacity=k<i?1:Math.min(1,f*3);continue;}const on=head>o;p.style.opacity=on?1:0;p.style.strokeDashoffset=on?Math.max(0,len-(head-o)):len+2;}});
 cap.textContent=i<0?'':STEPS[i].caption;count.textContent=i<0?'':'Step '+(i+1)+' of '+STEPS.length;
 nextBtn.textContent=i<0?'Start':i>=STEPS.length-1&&f>=1?'Again':'Next';document.getElementById('back').disabled=i<=0;}
let cur=-1,raf=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i,animate=true){cancelAnimationFrame(raf);cur=i;if(i<0||!animate||reduced)return paint(i,1);const t0=performance.now(),ms=drawMs(i);
 const tick=t=>{const f=Math.min(1,(t-t0)/ms);paint(i,f);if(f<1)raf=requestAnimationFrame(tick);else{raf=0;if(auto&&cur<STEPS.length-1)setTimeout(()=>{if(auto&&cur===i)go(i+1);},(STEPS[i].hold??REST)*1000);}};raf=requestAnimationFrame(tick);}
// Next finishes a step that is still drawing before moving on, so a clicker never skips a step.
function next(){if(raf){cancelAnimationFrame(raf);raf=0;return paint(cur,1);}if(cur>=STEPS.length-1)return go(0);go(cur+1);}
function back(){auto=false;if(cur>0)go(cur-1,false);}
const q=new URLSearchParams(location.search);let auto=q.has('autoplay');
document.getElementById('stage').onclick=()=>{auto=false;next();};nextBtn.onclick=()=>{auto=false;next();};document.getElementById('back').onclick=back;
document.getElementById('capbtn').onclick=e=>{const on=document.getElementById('m').classList.toggle('nocap');e.target.setAttribute('aria-pressed',String(!on));};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
 if(['ArrowRight','PageDown',' ','Enter','n'].includes(e.key)){e.preventDefault();auto=false;next();}
 else if(['ArrowLeft','PageUp','Backspace','p'].includes(e.key)){e.preventDefault();back();}
 else if(e.key==='Home'){auto=false;go(-1);}else if(e.key==='End'){auto=false;go(STEPS.length-1,false);}
 else if(e.key==='c')document.getElementById('capbtn').click();else if(e.key==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();});
if(q.has('nocap'))document.getElementById('m').classList.add('nocap');
if(q.has('step'))go(Math.min(STEPS.length,+q.get('step'))-1,false);else if(auto)go(0);else paint(-1,1);
// Video export: a fixed timeline of lead-in, then for each step its draw time and its hold.
window.__timeline=()=>{let t=0.6;const segs=STEPS.map((s,i)=>{const seg={i,start:t,draw:drawMs(i)/1000,hold:s.hold??REST};t+=seg.draw+seg.hold;return seg;});return {segs,total:t+1.5};};
window.__seek=sec=>{const {segs}=window.__timeline();let i=-1,f=1;for(const s of segs){if(sec>=s.start){i=s.i;f=Math.min(1,(sec-s.start)/s.draw);}}paint(i,f);};
